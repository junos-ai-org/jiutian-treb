name: Build SFT image

# Build + push the T5Gemma SFT training image to Docker Hub.
# Tags: <short-sha>, latest (on branch push), plus any manual tags given.
#
# Triggers:
#   - push to experiment-setup touching models/t5gemma-2-4b-sft/** or this workflow
#   - manual dispatch with optional extra tag
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  — achithanar
#   DOCKERHUB_TOKEN     — Docker Hub access token (Read/Write/Delete)

on:
  push:
    branches: [experiment-setup, main]
    paths:
      - 'models/t5gemma-2-4b-sft/**'
      - '.github/workflows/build-sft-image.yml'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Optional extra tag (e.g., flan-100k)'
        required: false
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: achithanar/t5gemma-sft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHA}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ -n "${{ github.event.inputs.extra_tag }}" ]]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.extra_tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "pinned=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: models/t5gemma-2-4b-sft
          file: models/t5gemma-2-4b-sft/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned: \`${{ steps.tags.outputs.pinned }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "All tags: \`${{ steps.tags.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
