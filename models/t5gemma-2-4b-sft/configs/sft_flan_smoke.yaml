# Smoke config: verify the full pipeline end-to-end in <30 min, minimal cost.
# Tiny FLAN subset, 50 training steps, no hub push, no wandb.
# Purpose: catch pod boot, GPU access, data/model download, and non-zero loss
# issues BEFORE kicking off the full run.

model:
  name_or_path: google/t5gemma-2-4b-4b
  attn_implementation: eager
  dtype: bfloat16
  device_map: auto

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none
  task_type: SEQ_2_SEQ_LM

data:
  dataset_name: Open-Orca/FLAN
  train_size: 200
  eval_size: 20
  seed: 42
  input_field: inputs
  target_field: targets
  max_input_length: 1024
  max_target_length: 256
  cache_dir: /workspace/hf-cache
  tokenized_dir: /workspace/flan-tokenized-smoke

training:
  output_dir: /workspace/checkpoints/t5gemma-2-4b-flan-sft-smoke
  max_steps: 50                     # hard cap; ignores num_train_epochs
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 25
  save_strategy: steps
  save_steps: 25
  save_total_limit: 1
  predict_with_generate: true
  generation_max_length: 128
  report_to: []                     # no wandb for smoke
  run_name: t5gemma-2-4b-flan-sft-smoke
  seed: 42

hub:
  push_to_hub: false
  hub_model_id: DiffusionTableQA/t5gemma-2-4b-flan-sft-smoke
  hub_strategy: every_save
  hub_private_repo: true
