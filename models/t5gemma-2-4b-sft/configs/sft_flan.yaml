# SFT config for T5Gemma 2 4B-4B on a FLAN subset (QLoRA, Seq2SeqTrainer).
# Loaded by train.py.

model:
  name_or_path: google/t5gemma-2-4b-4b
  attn_implementation: eager        # flash_attention_2 has known bugs on T5Gemma
  dtype: bfloat16                   # v5 renamed torch_dtype → dtype
  device_map: auto                  # required for bnb 4-bit loading

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none
  task_type: SEQ_2_SEQ_LM

data:
  dataset_name: Open-Orca/FLAN
  # FLAN is ~15M rows; subset for a fair-cost LoRA SFT.
  train_size: 100000
  eval_size: 1000
  seed: 42
  input_field: inputs
  target_field: targets
  max_input_length: 2048
  max_target_length: 512
  cache_dir: /workspace/hf-cache
  tokenized_dir: /workspace/flan-tokenized   # skip re-tokenization on resume

training:
  output_dir: /workspace/checkpoints/t5gemma-2-4b-flan-sft
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8             # effective batch = 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  logging_steps: 25
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  predict_with_generate: true
  generation_max_length: 512
  report_to: [wandb]
  run_name: t5gemma-2-4b-flan-sft
  seed: 42

hub:
  push_to_hub: true
  hub_model_id: DiffusionTableQA/t5gemma-2-4b-flan-sft
  hub_strategy: checkpoint
  hub_private_repo: true
