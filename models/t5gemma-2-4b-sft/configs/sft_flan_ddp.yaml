# DDP variant of sft_flan.yaml for multi-GPU runs.
# batch_per_gpu × grad_accum × N_gpus = 32 (matches 1-GPU run for apples-to-apples).
# At N=4:  2 × 4 × 4 = 32

model:
  name_or_path: google/t5gemma-2-4b-4b
  attn_implementation: eager
  dtype: bfloat16
  device_map: auto

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none
  task_type: SEQ_2_SEQ_LM

data:
  dataset_name: Open-Orca/FLAN
  train_size: 100000
  eval_size: 1000
  seed: 42
  input_field: inputs
  target_field: targets
  max_input_length: 1024
  max_target_length: 384
  cache_dir: /workspace/hf-cache
  tokenized_dir: /workspace/flan-tokenized

training:
  output_dir: /workspace/checkpoints/t5gemma-2-4b-flan-sft-ddp
  num_train_epochs: 1
  per_device_train_batch_size: 2             # 2 × 4 × 4 GPUs = 32 effective
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  logging_steps: 25
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  predict_with_generate: false
  generation_max_length: 384
  report_to: [wandb]
  run_name: t5gemma-2-4b-flan-sft-ddp-4xh100
  seed: 42

hub:
  push_to_hub: true
  hub_model_id: DiffusionTableQA/t5gemma-2-4b-flan-sft-ddp
  hub_strategy: checkpoint
  hub_private_repo: true
