# Qwen 2.5 7B Instruct — strong decoder-only baseline, param-matched to
# T5Gemma 2 4B-4B's total (7.58B). Served via vLLM for throughput.

variant: qwen_7b_instruct

model:
  backend: vllm
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  revision: null
  adapter: null
  dtype: bfloat16
  # vLLM-specific
  gpu_memory_utilization: 0.90
  max_model_len: 32768        # Qwen 2.5 native context. Some TReB prompts are >32K — eval.py truncates oversize tables.
  tensor_parallel_size: 1     # 7B fits on 1× H100; bump to 2 if we want faster wall-clock

generation:
  max_new_tokens: 512
  temperature: 0.0            # greedy via temp=0 in vLLM
  top_p: 1.0

eval:
  dataset: JT-LM/JIUTIAN-TReB
  language: English
  mode: TCoT                  # scoped: TCoT only. PoT/ICoT are a follow-up experiment.
  smoke_size: 100
  # vLLM batches internally; we pass all prompts in one list.

output:
  predictions_path: /workspace/results/qwen_7b_instruct/predictions.jsonl
  metrics_path: /workspace/results/qwen_7b_instruct/metrics.json
