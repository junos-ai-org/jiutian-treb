# T5Gemma v1 2B-2B UL2-IT on the 1000-sample stratified subset (2026-04-23).
# Same model + generation config as t5gemma_v1_2b2b_ul2_it.yaml; differs only
# in target_ids (sample_1000.json) and output paths.

variant: t5gemma_v1_1k

model:
  backend: hf_seq2seq
  name_or_path: google/t5gemma-2b-2b-ul2-it
  revision: null
  adapter: null
  dtype: bfloat16
  attn_implementation: eager
  device_map: auto

generation:
  max_new_tokens: 256
  do_sample: false
  num_beams: 1
  temperature: 1.0

eval:
  dataset: JT-LM/JIUTIAN-TReB
  language: English
  mode: TCoT
  target_ids: dataset/sample_1000.json
  apply_chat_template: true
  smoke_size: 25
  batch_size: 1
  max_input_tokens: 4000

output:
  predictions_path: /workspace/results/t5gemma_v1_1k/predictions.jsonl
  metrics_path: /workspace/results/t5gemma_v1_1k/metrics.json
