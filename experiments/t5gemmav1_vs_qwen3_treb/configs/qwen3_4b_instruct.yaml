# Qwen3-4B-Instruct-2507 — Alibaba's 4B instruction-tuned decoder-only.
# Served via HF transformers AutoModelForCausalLM (hf_causal backend).
# Why not vLLM: the baked treb-eval-qwen image pins vllm<=0.7 which predates
# Qwen3 support (Qwen3 needs >=0.8.5); the full qwen image is 12.7GB and was
# slow to pull on RunPod at experiment time. hf_causal at batch=4 on an H100
# finishes 250 samples in a few minutes — plenty fast for this comparison.
# Reads the SAME target_ids list as t5gemma_v1_2b2b_ul2_it so the comparison
# is on a shared sample subset (filtered by T5Gemma tokenizer to fit its
# 4K SWA-safety window).

variant: qwen3_4b_instruct

model:
  backend: hf_causal
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  revision: null
  adapter: null
  dtype: bfloat16
  device_map: auto

generation:
  max_new_tokens: 256              # matches T5Gemma post-fix for comparability
  do_sample: false                 # greedy
  temperature: 1.0

eval:
  dataset: JT-LM/JIUTIAN-TReB
  language: English                # English only — Chinese out of scope.
  mode: TCoT
  target_ids: dataset/kept_ids.json
  # Stratified 250 by default; override to 25 via sed when smoke-testing.
  smoke_size: 250
  batch_size: 4                    # comfortable on H100 for a 4B model
  max_input_tokens: 8192           # Qwen3 tokenizer; 4K T5Gemma tokens is
                                    # roughly 5K Qwen tokens — 8K is ample.

output:
  predictions_path: /workspace/results/qwen3_4b_instruct/predictions.jsonl
  metrics_path: /workspace/results/qwen3_4b_instruct/metrics.json
